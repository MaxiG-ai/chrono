name: Chrono
options:
  bundleIdPrefix: app.chrono
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""

targets:
  Chrono:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Chrono
        excludes:
          - "**/*.md"
    resources:
      - path: Chrono/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chrono.Chrono
        INFOPLIST_FILE: Chrono/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Chrono/App/Chrono.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: "-lsqlite3"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: ChronoWidget
    info:
      path: Chrono/App/Info.plist

  ChronoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChronoWidget
      - path: Chrono/Shared/WidgetShared
      - path: Chrono/LiveActivity/ChronoActivityAttributes.swift
      - path: Chrono/Shared/Color+Hex.swift
      - path: Chrono/Shared/Date+Extensions.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chrono.Chrono.Widget
        INFOPLIST_FILE: ChronoWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ChronoWidget/ChronoWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "-lsqlite3"
        SKIP_INSTALL: YES
